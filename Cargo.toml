[package]
name = "renderdocx"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A native GPUI frontend for RenderDoc"
default-run = "renderdocx"
autobins = false

[[bin]]
name = "renderdocx"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "renderdocx-cli"
path = "src/bin/renderdocx-cli.rs"

[features]
default = ["gui"]
gui = ["dep:gpui-kit", "dep:rfd"]
gpui-fast = ["gui", "gpui-kit/gpui-fast"]
ui-tests = ["gui", "gpui-kit/test-support"]

[dependencies]
directories = "6"
half = "2.7"
pcre2 = "0.2"
gpui-kit = { version = "=0.9.1", optional = true }
rfd = { version = "0.15", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
which = "8"
tempfile = "3"

[dev-dependencies]
png = "0.18"
