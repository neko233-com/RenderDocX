[package]
name = "renderdocx"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A native GPUI frontend for RenderDoc"
default-run = "renderdocx"
autobins = false

[[bin]]
name = "renderdocx"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "renderdocx-cli"
path = "src/bin/renderdocx-cli.rs"

[features]
default = ["gui"]
gui = ["dep:gpui-kit", "dep:rfd"]
gpui-fast = ["gui", "gpui-kit/gpui-fast"]
ui-tests = ["gui", "gpui-kit/test-support"]

[dependencies]
directories = "6"
half = "2.7"
libloading = "0.8"
pcre2 = "0.2"
png = "0.18"
gpui-kit = { version = "=0.9.1", optional = true }
rfd = { version = "0.15", optional = true }
stacker = "0.1.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
sys-locale = "0.3"
unicode-segmentation = "1.13"
which = "8"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation"] }
