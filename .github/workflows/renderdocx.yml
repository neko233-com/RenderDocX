name: RenderDocX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A real RenderDoc core build takes longer than a typical change cycle.
  # Let the running validation finish; GitHub may replace older pending runs.
  cancel-in-progress: false

jobs:
  headless:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.99.1
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo test --locked --no-default-features

  ui:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        features: [ui-tests, "ui-tests,gpui-fast"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.99.1
      - run: cargo test --locked --features ${{ matrix.features }} --bin renderdocx

  real-replay:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.99.1
      - shell: pwsh
        run: ./scripts/test-windows.ps1
